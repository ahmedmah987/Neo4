[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo4"
version = "0.1.0"
description = "An exploration + rule-induction agent for the ARC-AGI-3 interactive benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "arc-agi>=0.9.9",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
neo4 = "neo4.run:main"

[tool.setuptools.packages.find]
include = ["neo4*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
